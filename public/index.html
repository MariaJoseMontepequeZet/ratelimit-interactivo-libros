<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Libros</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>📚 Tienda de Libros</h1>

        <!-- Medidor del rate limit: se llena con los headers RateLimit de cada respuesta -->
        <div class="medidor">
            <span id="medidor-texto">Peticiones: haz una consulta</span>
            <div class="barra"><div id="medidor-barra"></div></div>
        </div>
    </header>

    <!-- Aviso que sale cuando la API responde 429 -->
    <div id="aviso" class="aviso oculto" role="alert"></div>

    <main>
        <section class="tarjeta">
            <h2 id="form-titulo">Agregar libro</h2>
            <form id="form-libro">
                <input type="hidden" id="libro-id">
                <label>Título <input id="titulo" required></label>
                <label>Autor <input id="autor" required></label>
                <label>Género <input id="genero" required></label>
                <label>Año <input id="anio" type="number" required></label>
                <label>Precio <input id="precio" type="number" step="0.01" min="0" required></label>
                <div class="botones">
                    <button type="submit" id="btn-guardar">Guardar</button>
                    <button type="button" id="btn-cancelar" class="secundario oculto">Cancelar</button>
                </div>
            </form>
            <p id="mensaje" class="mensaje" role="status"></p>
        </section>

        <section class="tarjeta">
            <div class="fila-titulo">
                <h2>Catálogo (<span id="total">0</span>)</h2>
                <button id="btn-recargar" class="secundario">Recargar</button>
            </div>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Título</th><th>Autor</th><th>Género</th><th>Año</th><th>Precio</th><th></th></tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
